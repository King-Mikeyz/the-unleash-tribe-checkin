<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Set Up Account | The Unleash Tribe</title>

    <meta
        name="description"
        content="Complete your approved The Unleash Tribe member account."
    >

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/onboarding.css">
</head>

<body class="auth-page">

    <header class="auth-header">

        <div class="container auth-header-inner">

            <a
                href="index.html"
                class="auth-brand"
                aria-label="The Unleash Tribe home"
            >
                <span
                    class="auth-brand-symbol"
                    aria-hidden="true"
                >
                    UT
                </span>

                <span>
                    <strong>The Unleash Tribe</strong>
                    <small>Account Setup</small>
                </span>
            </a>

        </div>

    </header>


    <main class="onboarding-main">

        <section
            class="setup-card"
            aria-labelledby="setup-title"
        >

            <p class="auth-eyebrow">
                Welcome to the Tribe
            </p>

            <h1 id="setup-title">
                Create your account.
            </h1>

            <p>
                Your membership has been approved.
                Choose the username and password you will use to sign in.
            </p>


            <div
                id="setup-message"
                class="auth-message"
                role="status"
                aria-live="polite"
                hidden
            ></div>


            <form
                id="setup-form"
                class="setup-form"
                novalidate
                hidden
            >

                <label for="setup-email">
                    Email

                    <input
                        id="setup-email"
                        type="email"
                        autocomplete="email"
                        readonly
                        aria-readonly="true"
                    >
                </label>


                <label for="setup-username">
                    Username

                    <input
                        id="setup-username"
                        type="text"
                        minlength="3"
                        maxlength="30"
                        autocomplete="username"
                        autocapitalize="words"
                        spellcheck="false"
                        placeholder="e.g. King Michael"
                        required
                    >

                    <small>
                        3–30 characters. Letters, numbers, spaces,
                        hyphens and underscores are allowed.
                    </small>
                </label>


                <label for="setup-password">
                    Password

                    <input
                        id="setup-password"
                        type="password"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >
                </label>


                <label for="setup-confirm-password">
                    Confirm Password

                    <input
                        id="setup-confirm-password"
                        type="password"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >
                </label>


                <button
                    id="setup-button"
                    type="submit"
                    class="auth-submit"
                >
                    Complete Account Setup
                </button>

            </form>

        </section>

    </main>


    <script
        type="module"
        src="js/pages/setup-account.js"
    ></script>

</body>

</html>
