<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create New Password | The Unleash Tribe</title>

    <meta
        name="description"
        content="Create a new password for your Daily Check In account."
    >

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/auth.css">

</head>


<body class="auth-page">


<header class="auth-header">

    <div class="container auth-header-inner">


        <a
            href="index.html"
            class="auth-brand"
        >

            <span
                class="auth-brand-symbol"
                aria-hidden="true"
            >
                UT
            </span>


            <span>

                <strong>
                    The Unleash Tribe
                </strong>

                <small>
                    Daily Check In
                </small>

            </span>


        </a>


    </div>

</header>



<main class="auth-main">


<section class="auth-card">


<p class="auth-eyebrow">
    Password Reset
</p>


<h1>
    Create a new password.
</h1>


<p class="auth-intro">
    Choose a new password for your account.
</p>



<div
    id="auth-message"
    class="auth-message"
    role="status"
    aria-live="polite"
    hidden
></div>



<form
    id="reset-password-form"
    novalidate
>


<div class="form-field">

<label for="password">
    New password
</label>


<input
    type="password"
    id="password"
    name="password"
    autocomplete="new-password"
    minlength="8"
    required
>

</div>



<div class="form-field">

<label for="confirm-password">
    Confirm new password
</label>


<input
    type="password"
    id="confirm-password"
    name="confirm-password"
    autocomplete="new-password"
    minlength="8"
    required
>

</div>



<button
    id="reset-password-button"
    type="submit"
    class="auth-submit"
>
    Update Password
</button>


</form>


</section>


</main>



<script
    type="module"
    src="js/pages/reset-password.js"
></script>


</body>

</html>
